training:
  seed: 42
  device: "auto"          # auto|cpu|cuda|mps
  epochs: 10
  batch_size: 12
  grad_accum_steps: 8
  max_steps: null         # optional cap
  log_every: 50
  eval_every: 500
  save_every: 500
  num_workers: 2

optimizer:
  name: "adamw"
  lr: 3.0e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  grad_clip_norm: 1.0

scheduler:
  name: "cosine"
  warmup_steps: 500
  min_lr: 1.0e-5

data:
  train_pt: "data/processed/train.pt"
  val_pt: "data/processed/val.pt"
  block_size: 384

checkpoint:
  out_dir: "checkpoints"
  keep_last_n: 2

amp:
  enabled: true
