openapi: 3.0.3
info:
  title: AAIE LLM Pipeline API
  description: OpenAPI contract for FastAPI v2 endpoints - Submission evaluation with feedback generation and RC profile analysis.
  version: 2.0.0

servers:
  - url: /
    description: API service is mounted under root path (same behaviour as v1)

paths:
  /api/v2/evaluate:
    post:
      summary: Evaluate assignment submission against rubric criteria
      description: Returns evaluation results including criterion-level scores/feedback and a weighted score.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionRequestEvaluate'
            examples:
              fg_input_sample:
                $ref: '#/components/examples/FGInputSample'
      responses:
        '200':
          description: Evaluation generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluateResponse'
              examples:
                fg_output_sample:
                  $ref: '#/components/examples/FGOutputSample'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable entity (validation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error while generating evaluation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v2/rc_profile:
    post:
      summary: Generate student interaction profile (RC profile) from submission + chat log
      description: Produces dimension scores, AI use pattern, metrics, and explainability evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionRequestRcProfile'
            examples:
              rcprofile_submission_sample:
                $ref: '#/components/examples/RCProfileInputSample'
      responses:
        '200':
          description: RC profile generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RcProfileResponse'
              examples:
                rcprofile_output_sample:
                  $ref: '#/components/examples/RcProfileOutputSample'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable entity (validation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error while generating RC profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ErrorResponse:
      type: object
      description: Standard error envelope
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code (e.g., bad_request, validation_error, internal_error)
        message:
          type: string
          description: Human-readable summary of the error
        details:
          type: object
          description: Optional structured details (e.g., field level validation issues)
          additionalProperties: true
          
    SubmissionRequestEvaluate:
      type: object
      description: Request for evaluation; rubric and final_submission are required.
      required: [domain, assignment_description, rubric, submission]
      additionalProperties: false
      properties:
        domain:
          type: string
          description: Academic domain or discipline, e.g., Information Technology
        assignment_description:
          type: string
          description: Assignment description or question text
        rubric:
          type: object
          required: [rubric_id, criteria]
          additionalProperties: false
          properties:
            rubric_id:
              type: string
              pattern: ^rub_[a-z_]+_[0-9]{4}$
              description: Rubric identifier following AAIE naming convention
            criteria:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required: [criterion_id, name, description, performance_descriptors, weight]
                properties:
                  criterion_id:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                  performance_descriptors:
                    type: object
                    additionalProperties: false
                    required: [excellent, good, average, needs_improvement, poor]
                    properties:
                      excellent: { type: string }
                      good: { type: string }
                      average: { type: string }
                      needs_improvement: { type: string }
                      poor: { type: string }
                  weight:
                    type: number
                    minimum: 0
                    maximum: 100
        submission:
          type: object
          required: [final_submission]
          properties:
            final_submission:
              type: string
              minLength: 50
              description: Final student submission text used for grading.

    SubmissionRequestRcProfile:
      type: object
      description: Request for RC profile generation; final_submission and chat_log are required.
      required: [final_submission, chat_log]
      additionalProperties: false
      properties:
        chatlog_id:
          type: string
          description: Unique ID for the rc chat log submission. Follow rclog naming convention (e.g. rc_rub_it_0001_123456789_0002). 
        final_submission:
          type: string
          description: Final submission text as plain text
        chat_log:
          type: array
          description: Ordered list of chat messages related to this submission
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [role, message]
            properties:
              role:
                type: string
                enum: [user, assistant, system]
                description: Who sent the message
              message:
                type: string
                description: Raw text of the message

    EvaluateResponse:
      title: FG Output Schema
      type: array
      items:
        type: object
        additionalProperties: false
        required: [index, quality, authorship, criterion_scores, criterion_feedback, weighted_score_percent, feedback]
        properties:
          index:
            type: integer
            minimum: 0
          quality:
            type: string
            nullable: true
            description: Quality classification for this submission (e.g., Excellent, Good, etc.)
          authorship:
            type: string
            description: Authorship determination (human, ai, or hybrid)
          criterion_scores:
            type: object
            description: Numeric scores per criterion
            minProperties: 1
            additionalProperties:
              type: number
              minimum: 0
          criterion_feedback:
            type: object
            description: Feedback text per criterion
            minProperties: 1
            additionalProperties:
              type: string
          weighted_score_percent:
            type: number
            minimum: 0
            maximum: 100
          feedback:
            type: string
            description: Full holistic feedback text

    RcProfileResponse:
      title: StudentInteractionProfile
      type: object
      required: [scores, ai_use_pattern, process_notes]
      properties:
          chatlog_id:
            type: string
            description: Unique ID for the rc chat log submission. Follow rclog naming convention (e.g. rc_rub_it_0001_123456789_0002)
            
          profile_generated_at:
            type: string
            format: date-time
            description: Timestamp of profile generation

          scores:
            type: object
            required:
              - critical_thinking_score
              - problem_solving_score
              - engagement_score
            properties:
              critical_thinking_score:
                type: number
                minimum: 0
                maximum: 1
              problem_solving_score:
                type: number
                minimum: 0
                maximum: 1
              engagement_score:
                type: number
                minimum: 0
                maximum: 1

          ai_use_pattern:
            type: string
            enum:
              - generator_only
              - reviser
              - planner_checker
              - mixed
            description: Dominant pattern of AI usage based on prompt types

          process_notes:
            type: string
            description: Natural-language summary of student behaviour and interaction pattern

          indicator_metrics:
            type: object
            description: Raw counts used to compute dimension scores
            properties:
              critical_thinking:
                type: object
                properties:
                  explanation_prompts:
                    type: integer
                  verification_prompts:
                    type: integer
                  comparison_prompts:
                    type: integer
                  evidence_prompts:
                    type: integer
              problem_solving:
                type: object
                properties:
                  decomposition_prompts:
                    type: integer
                  iterative_revision_count:
                    type: integer
                  self_proposed_content_turns:
                    type: integer
                  feedback_uptake_events:
                    type: integer
              engagement:
                type: object
                properties:
                  student_token_ratio:
                    type: number
                  student_turn_count:
                    type: integer
                  distinct_episode_types:
                    type: integer
                  session_time_minutes:
                    type: number
              prompt_type_distribution:
                type: object
                description: Counts of prompt types based on rule-based classifier
                properties:
                  understand_prompt:
                    type: integer
                  plan_structure:
                    type: integer
                  generate_content:
                    type: integer
                  revise_content:
                    type: integer
                  polish_language:
                    type: integer
                  check_quality:
                    type: integer

          explainability_evidence:
            type: object
            description: Evidence excerpts and confidence scores supporting each dimension and AI Use Pattern (SRS FR-3.2.3)
            properties:
              critical_thinking:
                type: object
                properties:
                  confidence:
                    type: number
                    minimum: 0
                    maximum: 1
                  evidence:
                    type: array
                    description: Key excerpts used to support CT classification
                    items:
                      type: string
              problem_solving:
                type: object
                properties:
                  confidence:
                    type: number
                    minimum: 0
                    maximum: 1
                  evidence:
                    type: array
                    description: Excerpts illustrating PS indicators such as revisions or decomposition
                    items:
                      type: string
              engagement:
                type: object
                properties:
                  confidence:
                    type: number
                    minimum: 0
                    maximum: 1
                  evidence:
                    type: array
                    description: Excerpts showing behavioural engagement patterns
                    items:
                      type: string
              ai_use_pattern:
                type: object
                properties:
                  confidence:
                    type: number
                    minimum: 0
                    maximum: 1
                  evidence:
                    type: array
                    description: Excerpts that justify the chosen AI Use Pattern
                    items:
                      type: string
              
  examples:
    FGInputSample:
      summary: FG input sample (fg_input_sample.json)
      value:
        domain: "Information Technology"
        assignment_description: "Evaluate the effectiveness of multi-factor authentication (MFA) in preventing data breaches. Discuss various MFA methods, their usability and security trade-offs, and how MFA integrates into broader cybersecurity strategies."
        rubric:
          rubric_id: "rub_it_0002"
          criteria:
            - criterion_id: "c1"
              name: "Conceptual Understanding"
              description: "Demonstrates deep understanding of the topic and related concepts."
              performance_descriptors:
                excellent: "Shows precise and in-depth understanding with clear theoretical support."
                good: "Understands key concepts well with minor gaps."
                average: "Adequate explanation with some inaccuracies."
                needs_improvement: "Surface-level or confused understanding."
                poor: "Major misunderstandings or misrepresentations."
              weight: 15
            - criterion_id: "c2"
              name: "Application to Real-World Scenarios"
              description: "Applies concepts meaningfully to examples or scenarios."
              performance_descriptors:
                excellent: "Uses insightful and relevant examples clearly linked to concepts."
                good: "Examples mostly appropriate with some gaps in explanation."
                average: "Examples present but superficial or unclear connections."
                needs_improvement: "Vague or generic examples."
                poor: "No real-world application."
              weight: 20
            - criterion_id: "c3"
              name: "Critical Evaluation"
              description: "Analyzes challenges, limitations, or trade-offs thoughtfully."
              performance_descriptors:
                excellent: "Provides insightful, research-backed critical evaluation."
                good: "Reasonable evaluation but less depth."
                average: "Mentions challenges superficially."
                needs_improvement: "Unclear or irrelevant critique."
                poor: "No critical evaluation."
              weight: 40
            - criterion_id: "c4"
              name: "Structure and Academic Writing"
              description: "Quality of writing, flow, citations, and tone."
              performance_descriptors:
                excellent: "Clear, coherent, formal tone, flawless grammar, and proper referencing."
                good: "Mostly clear and professional; minor issues."
                average: "Organization present but inconsistent."
                needs_improvement: "Structure or tone hinder clarity; referencing weak."
                poor: "Disorganized or informal writing."
              weight: 25
        submission:
          final_submission: "Multi-Factor Authentication (MFA) is a security mechanism requiring users to provide two or more verification factors to access an account. These factors fall into three categories: something you know (passwords, PINs), something you have (smartphones, security tokens), and something you are (fingerprints, facial recognition). MFA significantly enhances security because even if one factor is compromised, attackers cannot gain access without the additional factors. In practice, banking applications commonly use MFA by combining passwords with SMS codes or authenticator apps. The 2020 Twitter breach demonstrated how accounts without MFA remain vulnerable. Organizations should implement MFA as a fundamental security layer to protect sensitive data."
    FGOutputSample:
      summary: FG output sample (fg_output_sample.json)
      value:
        - index: 1
          quality: null
          authorship: null
          criterion_scores:
            "Conceptual Understanding": 15
            "Application to Real-World Scenarios": 18
            "Critical Evaluation": 40
            "Structure and Academic Writing": 25
          criterion_feedback:
            "Conceptual Understanding": "The student's prompts show a comprehensive grasp of MFA, its components, and its role in cybersecurity, demonstrating deep theoretical understanding."
            "Application to Real-World Scenarios": "The student effectively prompts for comparisons of MFA methods and their integration into strategies, indicating a strong ability to apply concepts to practical scenarios."
            "Critical Evaluation": "The student consistently pushes for an analysis of trade-offs, limitations, and evolving attack vectors, showcasing excellent critical thinking and evaluation skills."
            "Structure and Academic Writing": "The student's prompts are clear, well-articulated, and directly address the assignment's requirements, indicating strong organizational and communication skills."
          weighted_score_percent: 98.0
          feedback: |
            EDUCATOR FEEDBACK & ACTIONABLE INSIGHTS
            The student demonstrates a strong learning process by actively seeking to understand the nuances of MFA, as evidenced by their detailed prompts exploring various methods, their trade-offs, and integration into broader strategies. The engagement level is high, consistently probing for deeper insights. To further enhance their learning, the student could explore specific case studies of data breaches where MFA was either effective or bypassed, and investigate the evolving landscape of MFA bypass techniques and countermeasures. This would deepen their critical evaluation and real-world application.

            RUBRIC SCORES
            Conceptual Understanding: 15/15 - The student's prompts show a comprehensive grasp of MFA, its components, and its role in cybersecurity, demonstrating deep theoretical understanding.
            Application to Real-World Scenarios: 18/20 - The student effectively prompts for comparisons of MFA methods and their integration into strategies, indicating a strong ability to apply concepts to practical scenarios.
            Critical Evaluation: 40/40 - The student consistently pushes for an analysis of trade-offs, limitations, and evolving attack vectors, showcasing excellent critical thinking and evaluation skills.
            Structure and Academic Writing: 25/25 - The student's prompts are clear, well-articulated, and directly address the assignment's requirements, indicating strong organizational and communication skills.
          
    RCProfileInputSample:
      summary: Submission request sample (a modified version of rca_output_sample_2.json without metadata fields as they are not required for GenAI to perform analysis)
      value:
        final_submission: "Multi-Factor Authentication (MFA) is a security mechanism requiring users to provide two or more verification factors to access an account. These factors fall into three categories: something you know (passwords, PINs), something you have (smartphones, security tokens), and something you are (fingerprints, facial recognition). MFA significantly enhances security because even if one factor is compromised, attackers cannot gain access without the additional factors. In practice, banking applications commonly use MFA by combining passwords with SMS codes or authenticator apps. The 2020 Twitter breach demonstrated how accounts without MFA remain vulnerable. Organizations should implement MFA as a fundamental security layer to protect sensitive data."
        chat_log:
          - role: "user"
            message: "I have an essay question: Evaluate the effectiveness of multi factor authentication in preventing data breaches. Discuss various MFA methods, their usability and security trade offs, and how MFA integrates into broader cybersecurity strategies. I am a postgraduate IT student, so I need a formal academic tone but still clear and readable. Can you explain the key concepts I need to understand for this topic and list the main MFA methods I should probably talk about?"
          - role: "assistant"
            message: "Below is a clear, academically appropriate explanation of the key concepts you need to understand for this essay, followed by a structured list of the main MFA methods relevant to a postgraduate-level discussion. This will give you a solid foundation for your later sections on effectiveness, usability trade-offs, and strategic integration.\n\n---\n\n# **1. Key Concepts You Need to Understand**\n\n## **1.1. What Multi-Factor Authentication (MFA) Is**\nMulti-Factor Authentication is an access-control mechanism that requires users to provide **two or more independent forms of verification** before access is granted. It reduces the likelihood that a single compromised credential (e.g., a stolen password) will lead to unauthorised access.\n\nMFA draws on the principle of **defence-in-depth**, ensuring that even if one layer of authentication fails, another layer still protects the system.\n\n---\n\n## **1.2. The Three Classical Authentication Factors**\n\n### **1.2.1. Something You Know**\nKnowledge-based factors such as:\n- Passwords  \n- PINs  \n- Security questions  \n\n**Weakness:** Easily guessed, phished, or leaked in breaches.\n\n### **1.2.2. Something You Have**\nPhysical or digital possession factors such as:\n- Smartphones  \n- Hardware tokens  \n- One-time passwords (OTPs)\n\n**Weakness:** Devices can be lost, stolen, cloned, or intercepted.\n\n### **1.2.3. Something You Are**\nBiometric characteristics such as:\n- Fingerprints  \n- Facial recognition  \n- Iris scanning  \n\n**Weakness:** Biometric spoofing, privacy concerns, accuracy issues.\n\n---\n\n## **1.3. Why MFA Is Effective**\nMFA mitigates common attack vectors:\n- **Credential stuffing:** Stolen passwords alone are useless if an attacker cannot satisfy a second factor.  \n- **Phishing:** Some MFA methods (especially phishing-resistant ones like FIDO2/WebAuthn) cannot be fooled by fake login pages.  \n- **Brute force attacks:** Additional factors make automated guessing ineffective.  \n- **Session hijacking:** Some MFA methods include signing challenges linked to the domain, making token theft harder.\n\nHowever, effectiveness depends on the type of MFA used. Some methods (e.g., SMS OTP) are weaker and vulnerable to SIM swapping, whereas hardware-based authenticators offer strong cryptographic protection.\n\n---\n\n## **1.4. Usability vs. Security Trade-offs**\nThis is a major discussion point for your essay. Key concepts include:\n\n### **Security–Usability Balance**\n- **High security often introduces friction**, lowering user adoption.  \n- **Highly usable methods may be weaker**, increasing risk.  \n- Organisations must choose MFA mechanisms that align with risk levels and user behaviour.\n\n### **Cognitive load**\nComplex authentication reduces usability and increases support costs.\n\n### **False acceptance / false rejection**\nRelevant for biometrics:\n- FAR (False Acceptance Rate)  \n- FRR (False Rejection Rate)  \n\n### **Operational overhead**\nE.g., cost of issuing hardware tokens, managing device resets, or supporting biometric systems.\n\n---\n\n## **1.5. MFA as Part of Broader Cybersecurity Strategy**\nMFA does not work in isolation. Your essay should mention its relationship with:\n\n- **Zero Trust Architecture (ZTA):** MFA is often a mandatory component of continuous verification.  \n- **Identity and Access Management (IAM):** MFA strengthens identity proofing.  \n- **Risk-based authentication:** MFA is triggered dynamically (e.g., high-risk login locations).  \n- **Regulatory compliance:** Many frameworks (e.g., NIST 800-63, PCI-DSS) require MFA.  \n- **Incident response:** MFA reduces lateral movement after credential compromise.\n\nThis reinforces that MFA enhances organisational resilience but is not a complete defence on its own."
          - "role": "user"
            "message": "Thank you, that is helpful. Can you propose a clear structure for a 1500 to 1800 word essay for this prompt, with section headings and a short description of what I should cover in each section? I want to make sure I cover effectiveness, different methods, trade offs, and integration into wider strategies."
          - "role": "assistant"
            "message": "Below is a well-structured, academically appropriate outline for a **1500–1800 word essay** that directly addresses *effectiveness*, *MFA methods*, *usability and security trade-offs*, and *integration into broader cybersecurity strategies*. Each section includes a short description of what to cover.\n\n---\n\n# **Proposed Essay Structure (1500–1800 words)**\n\n---\n\n## **1. Introduction (150–200 words)**  \n**Purpose:** Introduce MFA as a response to rising identity-based attacks.  \n**Cover:**  \n- The increasing role of credential compromise in data breaches (e.g., phishing, credential stuffing).  \n- Why MFA has become a key control in organisational security.  \n- Brief mention that effectiveness depends on choice of factors, usability, and integration with broader frameworks.  \n- Thesis statement: *MFA enhances security significantly, but its real effectiveness arises when organisations choose appropriate methods, balance usability with security, and embed MFA within a holistic cybersecurity strategy such as IAM or Zero Trust.*\n\n---\n\n## **2. Understanding Multi-Factor Authentication (200–250 words)**  \n**Purpose:** Establish the conceptual foundation.  \n**Cover:**  \n- Definition of MFA and how it differs from single-factor authentication.  \n- The three classical factors: knowledge, possession, inherence.  \n- Why combining independent factors reduces attack success.  \n- MFA as a form of defence-in-depth and risk mitigation.  \n\n---\n\n## **3. Common Attack Vectors and the Security Rationale for MFA (200–250 words)**  \n**Purpose:** Explain why MFA exists and demonstrate its threat relevance.  \n**Cover:**  \n- Overview of common identity-based attacks: phishing, credential stuffing, brute force, social engineering, session hijacking.  \n- Direct explanation of how MFA disrupts or mitigates these attacks.  \n- Limitations: some MFA methods still vulnerable (e.g., SMS to SIM-swapping, phishable TOTPs).  \n- Emphasise the concept that MFA strength varies widely depending on method.\n\n---\n\n## **4. Overview of Major MFA Methods (350–400 words)**  \n**Purpose:** Discuss the main MFA types you will later evaluate.  \n**Cover:**  \nProvide a clear explanation, with short strengths/weaknesses, for:  \n- **Passwords + SMS OTP**  \n- **Email OTP**  \n- **TOTP-based authenticators (Google Authenticator, Authy)**  \n- **Push-notification MFA (Duo, Microsoft Authenticator)**  \n- **Hardware security keys (FIDO2/WebAuthn, YubiKey)**  \n- **Smart cards/PKI tokens**  \n- **Biometrics (fingerprint, face, iris)**  \n- **Adaptive/Risk-based MFA (contextual signals, behavioural biometrics)**  \n\nExplain differences in security posture, e.g.:  \n- Phishable vs phishing-resistant MFA  \n- Cryptographic vs code-based authentication  \n\nThis section provides the foundation for evaluating trade-offs and effectiveness.\n\n---\n\n## **5. Usability and Security Trade-offs (250–300 words)**  \n**Purpose:** Demonstrate critical evaluation rather than simple description.  \n**Cover:**  \n- Security–usability tension: more secure methods often create more friction.  \n- Cognitive burden, user behaviour, and error rates.  \n- Specific issues:  \n  - SMS OTP convenience vs high vulnerability  \n  - Push fatigue attacks  \n  - Biometric privacy and accuracy limitations  \n  - Hardware key loss, cost, and provisioning complexity  \n- Organisational cost, help-desk overhead, device lifecycle management.  \n- The importance of matching method to context (risk-based selection).\n\nThis section strengthens the evaluation dimension of your essay.\n\n---\n\n## **6. Evaluating the Effectiveness of MFA in Preventing Data Breaches (250–300 words)**  \n**Purpose:** Directly address the core of the essay question.  \n**Cover:**  \n- Evidence and industry findings (Microsoft, Google, Verizon DBIR) showing major reduction in account compromise when MFA is enabled.  \n- Why effectiveness varies by MFA type (e.g., FIDO2 hardware keys provide near-complete phishing resistance; SMS OTP offers limited protection).  \n- A balanced critique: MFA is effective **only when implemented correctly** and **paired with secure factors**.  \n- Discuss situations where MFA fails or can be bypassed (SIM-swapping, MFA bombing, sophisticated adversaries, cookie theft).  \n- The importance of interoperability, user adoption, and consistent enforcement across systems.\n\n---\n\n## **7. Integration of MFA into Broader Cybersecurity Strategies (200–250 words)**  \n**Purpose:** Show that MFA alone is not sufficient; it is part of a layered approach.  \n**Cover:**  \n- MFA within **Identity and Access Management (IAM)** systems.  \n- MFA as a foundational element of **Zero Trust Architecture** (\"never trust, always verify\").  \n- The role of MFA in:  \n  - Access control  \n  - Segmentation and least privilege  \n  - Continuous authentication and risk scoring  \n- Regulatory and compliance drivers (NIST 800-63, PCI DSS, ISO 27001).  \n- How risk-based MFA adapts dynamically during suspicious logins, strengthening overall resilience.  \n- Emphasise that MFA is one control among many (not a standalone solution).\n\n---\n\n## **8. Conclusion (150–200 words)**  \n**Purpose:** Provide a clear, academically sound synthesis.  \n**Cover:**  \n- Reaffirm MFA’s role as a highly effective mitigation against identity-based attacks.  \n- Reinforce that effectiveness varies significantly depending on the MFA method chosen.  \n- Highlight that usability, user adoption, and operational context are equally important.  \n- Close by emphasising that MFA provides maximum value when integrated into holistic strategies like Zero Trust and IAM frameworks.  \n- Suggest future directions, e.g., passwordless authentication, universal adoption of phishing-resistant MFA.\n\n---\n\n# **Optional Add-ons (If You Want a Stronger Essay)**  \nI can also create:  \n- A complete 1500–1800 word essay based on this structure  \n- A polished introduction with a clear thesis statement  \n- A comparison table of MFA methods  \n- Diagrams showing MFA in Zero Trust  \n- A short literature review  \n- A conclusion that aligns with postgraduate academic expectations  \n\nJust tell me what you need next."
          - "role": "user"
            "message": "I have rewritten your introduction and first section slightly to make it sound more like my own writing. Can you check the flow and tell me if anything sounds too informal or unclear for a postgraduate essay?\n\nDraft text:\nData breaches continue to affect organisations across industries, as more systems move online and attackers find new ways to exploit people and technology. A large number of these incidents still involve misuse of valid credentials that have been stolen, guessed, or reused across different services. Because of this, multi factor authentication has become a key control for strengthening identity verification. Instead of trusting a password on its own, MFA requires users to prove their identity with two or more different factors, such as a password and a temporary code or biometric check.\\n\\nThis essay evaluates how effective MFA is in preventing data breaches, compares several common MFA methods and their usability security trade offs, and analyses how MFA fits into broader cybersecurity strategies. The argument presented is that MFA is highly effective at blocking many common attacks based on stolen or weak passwords, but its overall value depends on the specific methods organisations choose, how they implement them, and whether they address usability and human factors as part of a wider defence in depth approach.\\n\\nMulti factor authentication reduces the impact of credential compromise by adding extra barriers for attackers. In a single factor model, a password functions as a single point of failure. If an attacker can obtain it through phishing, malware, or a leaked password database, they can often log in without further resistance. Breach reports regularly show that such credential based attacks are one of the most common paths into organisational systems. By contrast, MFA combines something the user knows with something they have or something they are. This means an attacker must also control a device, such as a phone or hardware token, or successfully imitate a biometric factor.\\n\\nFrom a practical perspective, this blocks many low effort attacks. Stolen passwords from one service are less useful if another service requires MFA, because the attacker would also need access to the second factor. Basic phishing emails that trick users into typing passwords into fake login forms are also less effective when the password alone no longer grants access. In many cases this is enough to stop broad, automated attacks that rely on reused credentials.\\n\\nHowever, the protection provided by MFA is not absolute. Attackers have adapted by targeting the additional factor itself, for example by using SIM swapping to intercept text messages or by bombarding users with push notifications until they accept one by mistake. More advanced techniques, such as adversary in the middle phishing kits, proxy the connection between the user and the real service and capture both the password and the one time code. As a result, the actual level of protection depends strongly on which MFA methods are used and how they are configured. The next section compares common implementations and examines their strengths and weaknesses in more detail."
          - "role": "assistant"
