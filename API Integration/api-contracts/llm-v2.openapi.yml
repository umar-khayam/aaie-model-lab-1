            "message": "Below is a polished, academically appropriate section consisting of four paragraphs. Each paragraph focuses on a specific group of MFA methods, comparing their strengths and weaknesses and explicitly addressing relevant attack techniques and usability considerations.\n\n---\n\nMulti-factor authentication can be implemented in several ways, and the level of protection it offers often depends on the specific method chosen. One of the most widely used methods is SMS-based one-time passwords (OTPs), largely because they are easy to deploy and familiar to users. However, SMS OTPs provide relatively weak security compared to other MFA options. They rely on the telecommunications network, which is vulnerable to attacks such as SIM swapping, number port-out fraud, and exploitation of flaws in the SS7 signalling system. In a SIM-swap attack, an adversary convinces a mobile provider to transfer the victim’s phone number to a new SIM card, allowing the attacker to intercept SMS codes and bypass MFA entirely. From a usability perspective, SMS codes are convenient and require no additional apps or hardware, which contributes to widespread adoption. Yet this same accessibility limits their long-term effectiveness, and many standards bodies—such as NIST—now discourage SMS OTP for high-risk environments due to its susceptibility to interception and phishing. As a result, SMS-based MFA is generally considered a modest improvement over password-only authentication, but insufficient against more sophisticated adversaries.\n\nAuthenticator applications, such as Google Authenticator or Authy, offer stronger security by generating time-based one-time passwords (TOTPs) locally on the user’s device. Because TOTP codes are not transmitted over a mobile network, they are not vulnerable to SIM-swapping or carrier-level exploits. However, they remain phishable: an attacker using an adversary-in-the-middle (AiTM) phishing toolkit can proxy a victim’s login session, capture both the password and the TOTP code in real time, and use them to authenticate. Usability is also mixed. Authenticator apps require initial setup, generate new codes every 30 seconds, and can be challenging for less technically confident users, particularly when transferring codes between devices. These usability barriers can increase support demands and reduce user compliance. Nonetheless, authenticator apps generally strike a better balance than SMS OTP by improving security while remaining accessible on most smartphones.\n\nPush-based MFA, commonly implemented through applications such as Duo, Okta Verify, or Microsoft Authenticator, shifts the user interaction from manual code entry to an approval prompt. This approach enhances usability by simplifying authentication to a single tap, reducing cognitive load and minimising time pressure. However, push notifications introduce their own security risks. Attackers increasingly rely on “MFA fatigue” or “push-bombing” techniques, in which they send repeated approval requests to a user in the hope that the user will mistakenly accept one. This social engineering technique exploits user behaviour rather than technical weaknesses. Push-based MFA is also vulnerable to AiTM attacks unless protected by additional measures such as number matching, contextual information, or device-bound cryptographic verification. When implemented with these safeguards, push-based MFA can provide strong and user-friendly authentication, but without them it risks becoming another channel for exploitation.\n\nAt the higher end of the security spectrum are hardware security keys (e.g., FIDO2/WebAuthn devices such as YubiKeys) and biometric authentication. Hardware keys provide robust, phishing-resistant MFA through public-key cryptography. The private key never leaves the device, and authentication is cryptographically bound to the legitimate domain, which prevents adversary-in-the-middle attacks entirely. The primary drawbacks are usability and operational overhead: users must carry a physical device, organisations must purchase and issue keys, and there is risk of loss or damage. Biometric methods, such as fingerprint or facial recognition, offer excellent usability because they are fast and require minimal effort from the user. However, biometrics introduce privacy concerns and have varying levels of resistance to spoofing. Unlike passwords, biometric identifiers cannot be changed if compromised. While both hardware keys and biometrics provide strong authentication, their effectiveness depends on secure device management, fallback methods, and appropriate integration into an overall identity strategy.\n\n---\n\nIf you’d like, I can refine this further, expand it into a longer section, or help integrate it smoothly into the next part of your essay."
